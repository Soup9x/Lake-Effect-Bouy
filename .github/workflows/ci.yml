name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal db)"
      - name: vet
        run: go vet ./...
      - name: test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test -race -count=1 ./...
      - name: cross-compile agent
        run: |
          GOOS=linux GOARCH=amd64 go build ./cmd/agent
          GOOS=linux GOARCH=arm64 go build ./cmd/agent
          GOOS=windows GOARCH=amd64 go build ./cmd/agent
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The Windows installer's inline C# (minisign verifier and private-CA
  # certificate check) must compile and pass its tests on Windows PowerShell
  # 5.1 (.NET Framework, C# 5) and PowerShell 7.
  windows-verifier:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verifier vectors on Windows PowerShell 5.1
        shell: powershell
        run: |
          Write-Host "Windows PowerShell $($PSVersionTable.PSVersion)"
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'expected Windows PowerShell 5.1' }
          foreach ($f in 'packaging\windows\install.ps1', 'packaging\windows\uninstall.ps1') {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errs)
            if ($errs.Count -gt 0) { $errs | ForEach-Object { Write-Host "${f}: $($_.Message)" }; exit 1 }
          }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File packaging\windows\tests\Test-Verifier.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File packaging\windows\tests\Test-Tls.ps1
          exit $LASTEXITCODE
      - name: Verifier vectors on PowerShell 7
        shell: pwsh
        run: |
          pwsh -NoProfile -File packaging/windows/tests/Test-Verifier.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File packaging/windows/tests/Test-Tls.ps1
          exit $LASTEXITCODE
