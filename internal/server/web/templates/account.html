{{define "content"}}
<h1>Account</h1>
<p>Signed in as <strong>{{.Session.User.Email}}</strong>.</p>
<h2>Change password</h2>
<div class="card">
<form class="stack" method="post" action="/account/password">
  {{template "csrf" .}}
  <label for="current">Current password</label><input id="current" type="password" name="current" required autocomplete="current-password">
  <label for="new">New password</label><input id="new" type="password" name="new" required minlength="12" autocomplete="new-password">
  <label for="confirm">Confirm new password</label><input id="confirm" type="password" name="confirm" required minlength="12" autocomplete="new-password">
  <p><button type="submit">Change password</button></p>
  <p class="small muted">Changing your password signs out your other sessions.</p>
</form>
</div>
{{end}}
